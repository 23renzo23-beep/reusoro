<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ReúsoRO · Herramienta analítica</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💧</text></svg>" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.css" />
  <style>
    html, body { margin: 0; background: #080b11; color: #e6edf3; }
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; font-family: system-ui, sans-serif; background: #080b11; z-index: 0; }
    #splash b { font-size: 34px; letter-spacing: .02em; } #splash b span { color: #2de3a7; }
    #splash small { color: #8b97a8; font-size: 14px; text-align: center; padding: 0 16px; }
    #splash i { width: 42px; height: 42px; border: 3px solid #1c2433; border-top-color: #2de3a7; border-radius: 50%;
      animation: g 1s linear infinite; } @keyframes g { to { transform: rotate(360deg); } }
    #root { position: relative; z-index: 1; }
  </style>
</head>
<body>
  <div id="splash"><b>Reúso<span>RO</span></b><i></i>
    <small>Cargando la herramienta analítica… la primera vez puede tardar unos 30 segundos.</small></div>
  <div id="root"></div>
  <script type="module">
    import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.11.0/build/stlite.js";
    mount({
      requirements: ["plotly"],
      entrypoint: "app.py",
      files: { "app.py": { url: "./app.py" } },
      streamlitConfig: {
        "theme.base": "dark",
        "theme.primaryColor": "#2de3a7",
        "theme.backgroundColor": "#080b11",
        "theme.secondaryBackgroundColor": "#0f1520",
        "theme.textColor": "#e6edf3",
        "client.toolbarMode": "viewer"
      }
    }, document.getElementById("root"));
  </script>
</body>
</html>
